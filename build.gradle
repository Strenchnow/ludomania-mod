plugins {
    id 'java'
    // ModDevGradle — официальный плагин сборки NeoForge
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neoforge_version

    // Запускаемые конфигурации (run configurations)
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    mavenCentral()
}

dependencies {
    // NeoForge подтягивается сам через блок neoForge {}
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
